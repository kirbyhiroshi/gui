<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ええいいやああ君からもらい泣き</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="container">
        <h1>BPM クリック計測ツール</h1>

        <section id="measurementMode">
            <h2>🎵 測定モード</h2>
            <p class="instruction">
                下のボタンまたは**スペースキー**をリズムよく叩いてください。
            </p>

            <button id="tapButton">
                TAP (スペースキー)
            </button>
            
            <div id="realtimeDisplay">
                <span id="displayBPM">--</span> <span class="unit">BPM</span>
            </div>
            
            <p id="message" class="status-message">計測準備完了</p>
        </section>

        <hr>

        <section id="recordArea" style="display: none;">
            <h2>💾 測定結果の保存</h2>
            <div class="input-group">
                <label for="songTitle">曲名を入力:</label>
                <input type="text" id="songTitle" placeholder="測定した曲名を入力してください">
                <button id="saveButton" disabled>このBPMで保存</button>
            </div>
        </section>

        <hr>

        <section id="recordListArea">
            <h2>📜 保存した楽曲リスト</h2>
            <table id="recordTable">
                <thead>
                    <tr>
                        <th>曲名</th>
                        <th>BPM</th>
                        <th>記録日時</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script> 
</body>
</html>
