<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>献立ランダムメーカー（和洋中選択版）</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>今日の献立は何にする？🤔</h1>

        <div class="selection-area">
            <h2>献立のジャンルを選択 (複数選択可)</h2>
            <div class="checkbox-group">
                <label><input type="checkbox" name="cuisine" value="Japanese" checked> 和食</label>
                <label><input type="checkbox" name="cuisine" value="American"> 洋食 (アメリカン)</label>
                <label><input type="checkbox" name="cuisine" value="Chinese"> 中華</label>
            </div>
        </div>

        <button id="get-meal-btn">献立を決める！</button>

        <div id="meal-display" class="meal-card">
            <p>ジャンルを選択して、ボタンを押してください。</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
