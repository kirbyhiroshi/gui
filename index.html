<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未来カレンダー - カスタムシミュレーション</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="control-panel">
            <h1>未来カレンダー</h1>
            <div class="settings">
                <span>表示年数</span>
                <input type="radio" name="display_years" value="35" checked><label>35年</label>
                <input type="radio" name="display_years" value="50"><label>50年</label>
                <input type="radio" name="display_years" value="65"><label>65年</label>
            </div>
            <button onclick="openInputModal()">家族構成の入力</button>
        </div>

        <div id="cashFlowArea">
            <div id="table-scroll-wrapper">
                <table id="cashFlowTable" class="cashFlow table table-bordered">
                    <thead>
                        <tr class="head head1">
                            <th colspan="2" class="fixed-column">経過年数</th>
                            </tr>
                        <tr class="head head2">
                            <th colspan="2" class="fixed-column">西暦</th>
                            </tr>
                    </thead>
                    <tbody id="sortable-table">
                        <tr class="data-row">
                            <th colspan="2" class="fixed-column">年収(手取り)</th>
                            </tr>
                        <tr class="data-row">
                            <th colspan="2" class="fixed-column">年間(実質)支出</th>
                        </tr>
                        <tr class="data-row">
                            <th colspan="2" class="fixed-column">年間の貯蓄額</th>
                        </tr>
                        <tr class="data-row important-row">
                            <th colspan="2" class="fixed-column">資産残高</th>
                        </tr>
                        <tr class="life-event-row">
                            <th colspan="2" class="fixed-column">主なライフイベント</th>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="simulation-options">
            <h2>/ 未来シミュレーション /</h2>
            <p>操作はカンタン、さまざまな未来をシミュレーションしてみよう。</p>
            <div class="option-grid">
                <div>住宅ローン</div>
                <div>賃貸 or 購入</div>
                <div>購入可能金額</div>
                <div>今すぐ or 貯めてから</div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
