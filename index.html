<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カスタム未来カレンダー | 家計シミュレーション</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>未来カレンダー💰</h1>
        
        <div id="input-area">
            <h2>初期設定</h2>
            <div>
                <label for="current-age">現在の年齢 (世帯主):</label>
                <input type="number" id="current-age" value="35" min="20" max="100">
            </div>
            <div>
                <label for="initial-asset">初期資産 (万円):</label>
                <input type="number" id="initial-asset" value="1000" min="0">
            </div>
            <div>
                <label for="annual-income">年間手取り収入 (万円):</label>
                <input type="number" id="annual-income" value="500" min="0">
            </div>
            <button id="run-simulation">シミュレーション実行</button>
        </div>

        <div id="cashflow-area">
            <h2>キャッシュフロー（未来カレンダー）</h2>
            <div id="table-container">
                <table id="cashflow-table">
                    <thead>
                        <tr>
                            <th>経過年数</th>
                            <th>年齢</th>
                            <th>収入</th>
                            <th>支出</th>
                            <th>年間収支</th>
                            <th>資産残高</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
