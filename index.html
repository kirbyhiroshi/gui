<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住宅ローン返済額計算機</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🏠 住宅ローン返済額計算機</h1>
        
        <div class="input-group">
            <label for="repaymentType">返済方式</label>
            <select id="repaymentType">
                <option value="genri">元利均等返済</option>
                <option value="gankin">元金均等返済</option>
            </select>
        </div>

        <div class="input-group">
            <label for="loanAmount">借入額（万円）</label>
            <input type="number" id="loanAmount" value="3000" min="100">
        </div>

        <div class="input-group">
            <label for="annualRate">年利（%）</label>
            <input type="number" id="annualRate" step="0.01" value="1.2" min="0">
        </div>

        <div class="input-group">
            <label for="years">返済期間（年）</label>
            <input type="number" id="years" value="35" min="1">
        </div>

        <button onclick="calculateLoan()">計算する</button>

        <div class="result-box">
            <h3 id="monthlyPaymentLabel">月々の返済額:</h3>
            <span id="monthlyPayment" class="result-value">---</span> 円
            <p id="variablePaymentNote" class="note-text" style="display: none;"></p>
        </div>
        
        <div class="result-box" style="margin-top: 15px;">
            <h3>総支払額（元金＋利息）:</h3>
            <span id="totalPayment" class="result-value">---</span> 円
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
