<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住宅ローン控除シミュレーター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="simulator-container">
        <h1>住宅ローン控除 年間控除額シミュレーター</h1>
        
        <div id="input-form">
            <h2>🏠 控除の基礎情報入力</h2>

            <div class="input-group">
                <label for="loan-balance">年末ローン残高 (万円)</label>
                <input type="number" id="loan-balance" value="3000" min="0">
            </div>

            <div class="input-group">
                <label for="income-tax">年間の源泉徴収税額 (所得税) (円)</label>
                <input type="number" id="income-tax" value="200000" min="0">
            </div>

            <div class="input-group">
                <label for="resident-taxable-income">住民税の課税所得金額 (円)</label>
                <input type="number" id="resident-taxable-income" value="3000000" min="0">
            </div>
            
            <div class="input-group">
                <label for="residence-type">住宅の種別 (最大借入限度額)</label>
                <select id="residence-type">
                    <option value="5000">長期優良住宅・低炭素住宅 (5,000万円)</option>
                    <option value="4500">ZEH水準省エネ住宅 (4,500万円)</option>
                    <option value="4000">省エネ基準適合住宅 (4,000万円)</option>
                    <option value="3000">その他の一般住宅 (3,000万円)</option>
                </select>
            </div>

            <button onclick="calculateDeduction()">シミュレーション実行</button>
        </div>

        <div id="results">
            <h2>✅ 計算結果 (年間)</h2>
            <p>※控除期間1年目の試算です。</p>
            <table>
                <tr>
                    <th>控除対象限度額 (万円)</th>
                    <td id="limit-display"></td>
                </tr>
                <tr>
                    <th>基本控除額 (0.7%)</th>
                    <td id="basic-deduction"></td>
                </tr>
                <tr>
                    <th>所得税からの控除額</th>
                    <td id="income-tax-deduction"></td>
                </tr>
                <tr>
                    <th>住民税からの控除額</th>
                    <td id="resident-tax-deduction"></td>
                </tr>
                <tr class="total">
                    <th>年間総控除額 (合計)</th>
                    <td id="total-deduction"></td>
                </tr>
            </table>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
